<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation Studio</title>
<style>
:root {
  --bg: #0f0f14;
  --surface: #1a1a24;
  --surface2: #222232;
  --border: #2a2a3a;
  --text: #c8c8d4;
  --text2: #8888a0;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --danger: #e74c3c;
  --success: #2ecc71;
  --warn: #f39c12;
  --radius: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.app { display:flex; flex-direction:column; height:100vh; }

/* Top Bar */
.topbar {
  display:flex; align-items:center; gap:10px;
  padding:8px 14px; background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0; z-index:10;
}
.topbar .brand { font-weight:700; font-size:15px; letter-spacing:-0.5px; color:var(--accent2); margin-right:8px; }
.topbar button {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:5px 10px; border-radius:var(--radius);
  cursor:pointer; font-size:12px; display:flex; align-items:center; gap:4px;
  transition: all .15s; white-space:nowrap;
}
.topbar button:hover { background:#2e2e42; border-color:#4a4a6a; }
.topbar button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.topbar button.danger { border-color:var(--danger); color:var(--danger); }
.topbar button.danger:hover { background:var(--danger); color:#fff; }
.topbar .sep { width:1px; height:22px; background:var(--border); margin:0 4px; }
.topbar .fps-group { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text2); }
.topbar .fps-group input { width:44px; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:4px 6px; border-radius:4px; font-size:12px; text-align:center; }

/* Main area */
.main { display:flex; flex:1; overflow:hidden; }

/* Left sidebar */
.sidebar {
  width:120px; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:10px 8px; gap:10px;
  flex-shrink:0; overflow-y:auto;
}
.sidebar .section-label {
  font-size:10px; text-transform:uppercase; letter-spacing:1px;
  color:var(--text2); margin-bottom:2px;
}
.tool-btn {
  display:flex; align-items:center; gap:6px;
  padding:7px 10px; border-radius:var(--radius); cursor:pointer;
  font-size:12px; color:var(--text); background:transparent; border:1px solid transparent;
  transition: all .15s;
}
.tool-btn:hover { background:var(--surface2); }
.tool-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.tool-btn svg { width:16px; height:16px; flex-shrink:0; }

.color-presets { display:flex; flex-wrap:wrap; gap:4px; }
.color-dot {
  width:22px; height:22px; border-radius:4px; cursor:pointer;
  border:2px solid transparent; transition:all .15s;
}
.color-dot:hover { transform:scale(1.15); }
.color-dot.active { border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,.3); }

.brush-size-group { display:flex; flex-direction:column; gap:4px; }
.brush-size-group input[type=range] { width:100%; accent-color:var(--accent); }
.brush-size-group .size-val { font-size:11px; color:var(--text2); text-align:center; }

.option-row {
  display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text2);
  cursor:pointer; padding:3px 0;
}
.option-row input { accent-color:var(--accent); }

/* Canvas area */
.canvas-area {
  flex:1; display:flex; align-items:center; justify-content:center;
  background:var(--bg);
  background-image: radial-gradient(circle, #1a1a2a 1px, transparent 1px);
  background-size: 20px 20px;
  position:relative; overflow:auto;
}
.canvas-wrapper {
  position:relative; box-shadow:0 0 40px rgba(108,92,231,.15);
  border:2px solid var(--border); border-radius:2px;
}
#mainCanvas { display:block; cursor:crosshair; }
.canvas-wrapper .frame-label {
  position:absolute; top:-22px; left:0; font-size:11px; color:var(--text2);
}

/* Timeline */
.timeline-wrap {
  background:var(--surface); border-top:1px solid var(--border);
  flex-shrink:0; display:flex; flex-direction:column;
}
.timeline-tools {
  display:flex; align-items:center; gap:6px; padding:6px 10px;
  border-bottom:1px solid var(--border);
}
.timeline-tools button {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:3px 8px; border-radius:4px;
  cursor:pointer; font-size:11px; transition:all .15s;
}
.timeline-tools button:hover { background:#2e2e42; }
.timeline {
  display:flex; gap:6px; padding:8px 10px; overflow-x:auto;
  align-items:flex-start; min-height:80px;
}
.frame-thumb {
  flex-shrink:0; position:relative; cursor:pointer;
  border:2px solid var(--border); border-radius:4px;
  transition:all .15s; overflow:hidden;
}
.frame-thumb:hover { border-color:var(--text2); }
.frame-thumb.active { border-color:var(--accent); box-shadow:0 0 12px rgba(108,92,231,.4); }
.frame-thumb canvas { display:block; }
.frame-thumb .frame-num {
  position:absolute; bottom:2px; right:4px;
  font-size:10px; color:#fff; text-shadow:0 0 3px #000;
  pointer-events:none;
}
.frame-thumb .frame-del {
  position:absolute; top:2px; right:2px;
  width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.7);
  color:var(--danger); font-size:12px; line-height:16px; text-align:center;
  cursor:pointer; opacity:0; transition:opacity .15s;
}
.frame-thumb:hover .frame-del { opacity:1; }
.add-frame-btn {
  flex-shrink:0; width:72px; height:54px;
  border:2px dashed var(--border); border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--text2); font-size:24px;
  transition:all .15s;
}
.add-frame-btn:hover { border-color:var(--accent); color:var(--accent); }

/* Toast */
.toast {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:var(--surface2); color:var(--text); padding:8px 20px;
  border-radius:20px; font-size:13px; border:1px solid var(--border);
  opacity:0; transition:opacity .3s; pointer-events:none; z-index:100;
}
.toast.show { opacity:1; }

/* Color picker popup */
.color-picker-popup {
  position:fixed; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:12px; z-index:50; display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.color-picker-popup.show { display:block; }
.color-picker-popup input[type=color] { width:100%; height:40px; border:none; cursor:pointer; background:transparent; }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#444; }

.canvas-wrapper canvas { max-width:calc(100vw - 200px); max-height:calc(100vh - 240px); }
@media (max-width:800px) {
  .canvas-wrapper canvas { max-width:calc(100vw - 120px); max-height:calc(100vh - 220px); }
  .sidebar { width:80px; padding:6px 4px; }
  .tool-btn { font-size:0; gap:0; justify-content:center; padding:6px; }
  .tool-btn svg { width:18px; height:18px; }
  .color-dot { width:18px; height:18px; }
  .sidebar .section-label { display:none; }
  .topbar button { font-size:11px; padding:4px 8px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">Animation Studio</span>
    <span class="sep"></span>
    <button id="btnFirst" title="First frame (Home)">&#x23EE;</button>
    <button id="btnPrev" title="Previous frame (Left)">&#x23EA;</button>
    <button id="btnPlay" title="Play (Space)">&#x25B6;</button>
    <button id="btnNext" title="Next frame (Right)">&#x23E9;</button>
    <button id="btnLast" title="Last frame (End)">&#x23ED;</button>
    <span class="sep"></span>
    <span class="fps-group">FPS <input type="number" id="fpsInput" value="12" min="1" max="60"></span>
    <span class="sep"></span>
    <button id="btnExportWebM">Export WebM</button>
    <button id="btnExportGIF">Export GIF</button>
    <button id="btnExportPNG">Export PNGs</button>
    <span class="sep"></span>
    <button id="btnClear" class="danger" title="Clear frame">Clear</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <span class="section-label">Tools</span>
      <div class="tool-btn active" data-tool="pen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Pen
      </div>
      <div class="tool-btn" data-tool="pencil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        Pencil
      </div>
      <div class="tool-btn" data-tool="eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.6 1.6c.8-.8 2-.8 2.8 0L21 5.2c.8.8.8 2 0 2.8L12 17"/><line x1="7" y1="17" x2="12" y2="12"/></svg>
        Eraser
      </div>
      <div class="tool-btn" data-tool="fill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        Fill
      </div>
      <div class="tool-btn" data-tool="picker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Pick
      </div>

      <span class="section-label">Color</span>
      <div class="color-presets" id="colorPresets"></div>
      <button class="tool-btn" id="btnMoreColors" style="margin-top:2px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 010 20"/><path d="M2 12h20"/></svg>
        More
      </button>

      <span class="section-label">Size</span>
      <div class="brush-size-group">
        <input type="range" id="brushSize" min="1" max="40" value="4">
        <span class="size-val" id="sizeVal">4px</span>
      </div>

      <span class="section-label">Options</span>
      <label class="option-row">
        <input type="checkbox" id="onionSkin" checked> Onion skin
      </label>
      <label class="option-row">
        <input type="checkbox" id="showGrid"> Grid
      </label>
      <label class="option-row">
        <input type="checkbox" id="mirrorH"> Mirror H
      </label>
      <label class="option-row">
        <input type="checkbox" id="mirrorV"> Mirror V
      </label>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrapper">
        <div class="frame-label" id="frameLabel">Frame 1 / 1</div>
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>
  </div>

  <div class="timeline-wrap">
    <div class="timeline-tools">
      <button id="btnAddFrame">+ Add Frame</button>
      <button id="btnDupFrame">Duplicate</button>
      <button id="btnMoveLeft" title="Move left">&#x25C0;</button>
      <button id="btnMoveRight" title="Move right">&#x25B6;</button>
      <span style="font-size:11px;color:var(--text2);margin-left:auto;" id="frameCountLabel">1 frame</span>
    </div>
    <div class="timeline" id="timeline">
      <div class="add-frame-btn" id="addFrameBtn" title="Add frame">+</div>
    </div>
  </div>
</div>

<div class="color-picker-popup" id="colorPickerPopup">
  <input type="color" id="colorPickerInput" value="#ffffff">
</div>

<div class="toast" id="toast"></div>

<script>
// ========== APP STATE ==========
const state = {
  frames: [],
  currentFrame: 0,
  fps: 12,
  tool: 'pen',
  color: '#ffffff',
  brushSize: 4,
  onionSkin: true,
  showGrid: false,
  mirrorH: false,
  mirrorV: false,
  playing: false,
  playTimer: null,
  canvasW: 480,
  canvasH: 320,
  isDrawing: false,
  lastX: 0, lastY: 0,
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const mainCanvas = $('#mainCanvas');
const ctx = mainCanvas.getContext('2d');
const timeline = $('#timeline');
const frameLabel = $('#frameLabel');
const frameCountLabel = $('#frameCountLabel');
const toast = $('#toast');

function init() {
  mainCanvas.width = state.canvasW;
  mainCanvas.height = state.canvasH;
  const blank = ctx.createImageData(state.canvasW, state.canvasH);
  state.frames.push(blank);
  renderFrame(0);
  renderTimeline();
  bindEvents();
}

function renderFrame(idx) {
  state.currentFrame = idx;
  const fd = state.frames[idx];
  if (!fd) return;
  ctx.putImageData(fd, 0, 0);
  if (state.showGrid) drawGrid();
  if (state.onionSkin && idx > 0) drawOnionSkin(idx);
  frameLabel.textContent = 'Frame ' + (idx+1) + ' / ' + state.frames.length;
  updateTimelineActive();
}

function drawGrid() {
  const step = 20;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 0.5;
  for (let x=step; x<state.canvasW; x+=step) {
    ctx.beginPath(); ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,state.canvasH); ctx.stroke();
  }
  for (let y=step; y<state.canvasH; y+=step) {
    ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(state.canvasW,y+0.5); ctx.stroke();
  }
  ctx.restore();
}

function drawOnionSkin(idx) {
  ctx.save();
  ctx.globalAlpha = 0.25;
  const prev = state.frames[idx-1];
  const tmp = new ImageData(new Uint8ClampedArray(prev.data), prev.width, prev.height);
  ctx.putImageData(tmp, 0, 0);
  ctx.restore();
}

function renderTimeline() {
  timeline.innerHTML = '';
  state.frames.forEach((fd, i) => {
    const div = document.createElement('div');
    div.className = 'frame-thumb' + (i === state.currentFrame ? ' active' : '');
    div.dataset.idx = i;
    const tc = document.createElement('canvas');
    tc.width = 72; tc.height = 54;
    const tctx = tc.getContext('2d');
    const tmpc = document.createElement('canvas');
    tmpc.width = state.canvasW; tmpc.height = state.canvasH;
    tmpc.getContext('2d').putImageData(fd, 0, 0);
    tctx.drawImage(tmpc, 0, 0, 72, 54);
    tctx.globalCompositeOperation = 'destination-over';
    drawCheckeredBg(tctx, 72, 54);
    div.appendChild(tc);

    const num = document.createElement('span');
    num.className = 'frame-num'; num.textContent = i+1;
    div.appendChild(num);

    const del = document.createElement('span');
    del.className = 'frame-del'; del.textContent = '\u00D7';
    del.onclick = (e) => { e.stopPropagation(); deleteFrame(i); };
    div.appendChild(del);

    div.onclick = () => { saveCurrentFrame(); renderFrame(i); };
    timeline.appendChild(div);
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'add-frame-btn'; addBtn.textContent = '+';
  addBtn.onclick = () => { saveCurrentFrame(); addFrame(); };
  timeline.appendChild(addBtn);
  frameCountLabel.textContent = state.frames.length + ' frames';
}

function drawCheckeredBg(ctx, w, h) {
  const s = 6;
  for (let y=0; y<h; y+=s)
    for (let x=0; x<w; x+=s) {
      ctx.fillStyle = ((x/s + y/s) % 2 === 0) ? '#ccc' : '#fff';
      ctx.fillRect(x, y, s, s);
    }
}

function updateTimelineActive() {
  $$('.frame-thumb').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === state.currentFrame);
  });
}

function saveCurrentFrame() {
  const clean = ctx.createImageData(state.canvasW, state.canvasH);
  clean.data.set(state.frames[state.currentFrame].data);
  state.frames[state.currentFrame] = clean;
}

function addFrame() {
  const blank = ctx.createImageData(state.canvasW, state.canvasH);
  state.frames.splice(state.currentFrame + 1, 0, blank);
  state.currentFrame++;
  renderFrame(state.currentFrame);
  renderTimeline();
}

function deleteFrame(idx) {
  if (state.frames.length <= 1) { showToast('Need at least 1 frame'); return; }
  state.frames.splice(idx, 1);
  if (state.currentFrame >= state.frames.length) state.currentFrame = state.frames.length - 1;
  renderFrame(state.currentFrame);
  renderTimeline();
}

function duplicateFrame() {
  const fd = state.frames[state.currentFrame];
  const copy = new ImageData(new Uint8ClampedArray(fd.data), fd.width, fd.height);
  state.frames.splice(state.currentFrame + 1, 0, copy);
  state.currentFrame++;
  renderFrame(state.currentFrame);
  renderTimeline();
}

function moveFrame(dir) {
  const idx = state.currentFrame;
  const ni = idx + dir;
  if (ni < 0 || ni >= state.frames.length) return;
  [state.frames[idx], state.frames[ni]] = [state.frames[ni], state.frames[idx]];
  state.currentFrame = ni;
  renderFrame(state.currentFrame);
  renderTimeline();
}

// ========== DRAWING ==========
function getCanvasPos(e) {
  const rect = mainCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * state.canvasW / rect.width,
    y: (e.clientY - rect.top) * state.canvasH / rect.height,
  };
}

function drawDot(x, y) {
  const s = state.brushSize, half = s/2;
  const cx = Math.floor(x - half), cy = Math.floor(y - half);
  const color = hexToRgba(state.color);
  const fd = state.frames[state.currentFrame];

  for (let dy=0; dy<s; dy++) {
    for (let dx=0; dx<s; dx++) {
      const px=cx+dx, py=cy+dy;
      const dist = Math.sqrt((dx+0.5-half)*(dx+0.5-half) + (dy+0.5-half)*(dy+0.5-half));
      if (dist>half || px<0 || py<0 || px>=state.canvasW || py>=state.canvasH) continue;
      const i = (py*state.canvasW+px)*4;
      const alpha = dist < half-1 ? 1 : (half-dist);
      fd.data[i]   = Math.round(color.r*alpha + fd.data[i]*(1-alpha));
      fd.data[i+1] = Math.round(color.g*alpha + fd.data[i+1]*(1-alpha));
      fd.data[i+2] = Math.round(color.b*alpha + fd.data[i+2]*(1-alpha));
      if (alpha > 0.5) fd.data[i+3] = 255;
    }
  }

  if (state.mirrorH) drawDotMirror(state.canvasW-1-x, y, color);
  if (state.mirrorV) drawDotMirror(x, state.canvasH-1-y, color);
  if (state.mirrorH && state.mirrorV) drawDotMirror(state.canvasW-1-x, state.canvasH-1-y, color);
}

function drawDotMirror(x, y, color) {
  const s=state.brushSize, half=s/2, cx=Math.floor(x-half), cy=Math.floor(y-half);
  const fd=state.frames[state.currentFrame];
  for (let dy=0; dy<s; dy++)
    for (let dx=0; dx<s; dx++) {
      const px=cx+dx, py=cy+dy;
      const dist=Math.sqrt((dx+0.5-half)*(dx+0.5-half)+(dy+0.5-half)*(dy+0.5-half));
      if (dist>half||px<0||py<0||px>=state.canvasW||py>=state.canvasH) continue;
      const i=(py*state.canvasW+px)*4, alpha=dist<half-1?1:(half-dist);
      fd.data[i]=Math.round(color.r*alpha+fd.data[i]*(1-alpha));
      fd.data[i+1]=Math.round(color.g*alpha+fd.data[i+1]*(1-alpha));
      fd.data[i+2]=Math.round(color.b*alpha+fd.data[i+2]*(1-alpha));
      if(alpha>0.5) fd.data[i+3]=255;
    }
}

function drawLine(x0, y0, x1, y1) {
  const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
  for (let i=0; i<=steps; i++) {
    const t = steps===0 ? 0 : i/steps;
    drawDot(x0+(x1-x0)*t, y0+(y1-y0)*t);
  }
}

function eraseLine(x0, y0, x1, y1) {
  const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
  for (let i=0; i<=steps; i++) {
    const t = steps===0 ? 0 : i/steps;
    eraseAt(x0+(x1-x0)*t, y0+(y1-y0)*t);
  }
}

function eraseAt(x, y) {
  const s=state.brushSize, half=s/2, cx=Math.floor(x-half), cy=Math.floor(y-half);
  const fd=state.frames[state.currentFrame];
  for (let dy=0; dy<s; dy++)
    for (let dx=0; dx<s; dx++) {
      const px=cx+dx, py=cy+dy;
      const dist=Math.sqrt((dx+0.5-half)*(dx+0.5-half)+(dy+0.5-half)*(dy+0.5-half));
      if (dist>half||px<0||py<0||px>=state.canvasW||py>=state.canvasH) continue;
      const i=(py*state.canvasW+px)*4;
      fd.data[i]=0; fd.data[i+1]=0; fd.data[i+2]=0; fd.data[i+3]=0;
    }
  if(state.mirrorH) eraseAt(state.canvasW-1-x, y);
  if(state.mirrorV) eraseAt(x, state.canvasH-1-y);
  if(state.mirrorH&&state.mirrorV) eraseAt(state.canvasW-1-x, state.canvasH-1-y);
}

function floodFill(sx, sy, fillColor) {
  sx=Math.floor(sx); sy=Math.floor(sy);
  if (sx<0||sx>=state.canvasW||sy<0||sy>=state.canvasH) return;
  const fd=state.frames[state.currentFrame], d=fd.data, w=state.canvasW, h=state.canvasH;
  const ti=(sy*w+sx)*4;
  const tr=d[ti], tg=d[ti+1], tb=d[ti+2], ta=d[ti+3];
  const fc=hexToRgba(fillColor), fr=Math.round(fc.r), fg=Math.round(fc.g), fb=Math.round(fc.b), fa=255;
  if (tr===fr&&tg===fg&&tb===fb&&ta===fa) return;
  const stack=[[sx,sy]], visited=new Uint8Array(w*h);
  let si=0;
  while(si<stack.length) {
    const [x,y]=stack[si++], idx=(y*w+x)*4;
    if(visited[y*w+x]) continue;
    if(d[idx]!==tr||d[idx+1]!==tg||d[idx+2]!==tb||d[idx+3]!==ta) continue;
    visited[y*w+x]=1;
    d[idx]=fr; d[idx+1]=fg; d[idx+2]=fb; d[idx+3]=fa;
    if(x>0) stack.push([x-1,y]);
    if(x<w-1) stack.push([x+1,y]);
    if(y>0) stack.push([x,y-1]);
    if(y<h-1) stack.push([x,y+1]);
  }
}

function pickColorAt(x, y) {
  const fd=state.frames[state.currentFrame];
  const idx=(Math.floor(y)*state.canvasW+Math.floor(x))*4;
  const r=fd.data[idx], g=fd.data[idx+1], b=fd.data[idx+2], a=fd.data[idx+3];
  if (a===0) return;
  state.color='#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
  updateColorUI();
}

// ========== CANVAS EVENTS ==========
mainCanvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const pos = getCanvasPos(e);
  state.isDrawing = true;
  state.lastX = pos.x; state.lastY = pos.y;

  if (state.tool === 'fill') {
    floodFill(pos.x, pos.y, state.color);
    renderFrame(state.currentFrame); renderTimeline();
    state.isDrawing = false;
  } else if (state.tool === 'picker') {
    pickColorAt(pos.x, pos.y);
    state.isDrawing = false;
  } else {
    drawDot(pos.x, pos.y);
    renderFrame(state.currentFrame);
  }
});

mainCanvas.addEventListener('mousemove', (e) => {
  if (!state.isDrawing) return;
  const pos = getCanvasPos(e);
  if (state.tool === 'eraser') {
    eraseLine(state.lastX, state.lastY, pos.x, pos.y);
  } else if (state.tool === 'pen' || state.tool === 'pencil') {
    drawLine(state.lastX, state.lastY, pos.x, pos.y);
  }
  state.lastX = pos.x; state.lastY = pos.y;
  renderFrame(state.currentFrame);
});

mainCanvas.addEventListener('mouseup', () => {
  if (state.isDrawing) { state.isDrawing = false; renderTimeline(); }
});

mainCanvas.addEventListener('mouseleave', () => {
  if (state.isDrawing) { state.isDrawing = false; renderTimeline(); }
});

// Touch
mainCanvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const pos = getCanvasPos(e.touches[0]);
  state.isDrawing = true; state.lastX = pos.x; state.lastY = pos.y;
  if (state.tool === 'fill') {
    floodFill(pos.x, pos.y, state.color);
    renderFrame(state.currentFrame); renderTimeline(); state.isDrawing = false;
  } else if (state.tool === 'picker') {
    pickColorAt(pos.x, pos.y); state.isDrawing = false;
  } else { drawDot(pos.x, pos.y); renderFrame(state.currentFrame); }
});
mainCanvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!state.isDrawing) return;
  const pos = getCanvasPos(e.touches[0]);
  if (state.tool === 'eraser') {
    eraseLine(state.lastX, state.lastY, pos.x, pos.y);
  } else {
    drawLine(state.lastX, state.lastY, pos.x, pos.y);
  }
  state.lastX = pos.x; state.lastY = pos.y;
  renderFrame(state.currentFrame);
});
mainCanvas.addEventListener('touchend', () => {
  if (state.isDrawing) { state.isDrawing = false; renderTimeline(); }
});

// ========== PLAYBACK ==========
function togglePlay() {
  state.playing ? stopPlay() : startPlay();
}

function startPlay() {
  if (state.frames.length <= 1) return;
  state.playing = true;
  $('#btnPlay').innerHTML = '&#x23F8;';
  $('#btnPlay').classList.add('active');
  playLoop();
}

function stopPlay() {
  state.playing = false;
  $('#btnPlay').innerHTML = '&#x25B6;';
  $('#btnPlay').classList.remove('active');
  if (state.playTimer) clearTimeout(state.playTimer);
}

function playLoop() {
  if (!state.playing) return;
  state.currentFrame = (state.currentFrame + 1) % state.frames.length;
  renderFrame(state.currentFrame);
  state.playTimer = setTimeout(playLoop, 1000 / state.fps);
}

// ========== EXPORT ==========
function exportWebM() {
  stopPlay();
  showToast('Exporting WebM...');
  const offc = document.createElement('canvas');
  offc.width=state.canvasW; offc.height=state.canvasH;
  const offctx = offc.getContext('2d');
  const stream = offc.captureStream(state.fps);
  const recorder = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp9', videoBitsPerSecond:2500000});
  const chunks = [];
  recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop = () => {
    downloadBlob(new Blob(chunks,{type:'video/webm'}), 'animation.webm');
    showToast('WebM exported!');
  };
  recorder.start();
  let fi=0;
  function drawNext() {
    if (fi>=state.frames.length) { recorder.stop(); return; }
    offctx.putImageData(state.frames[fi],0,0);
    fi++;
    setTimeout(drawNext, 1000/state.fps);
  }
  drawNext();
}

function exportGIF() {
  stopPlay();
  showToast('Generating GIF...');
  const gifData = encodeGIF(state.frames, state.fps);
  downloadBlob(new Blob([gifData], {type:'image/gif'}), 'animation.gif');
  showToast('GIF exported!');
}

function encodeGIF(frames, fps) {
  const delay = Math.round(100/fps);
  const w=frames[0].width, h=frames[0].height;
  const palette = buildPalette(frames);
  const parts = [];

  // Header
  parts.push(stringToBytes('GIF89a'));
  parts.push(shortToBytes(w));
  parts.push(shortToBytes(h));
  parts.push([0xF7, 0, 0]); // GCT 256 colors

  // Global Color Table
  for (let i=0; i<256; i++)
    parts.push([palette[i*3]||0, palette[i*3+1]||0, palette[i*3+2]||0]);

  // Netscape loop extension
  parts.push([0x21,0xFF,0x0B]);
  parts.push(stringToBytes('NETSCAPE2.0'));
  parts.push([0x03,0x01]);
  parts.push(shortToBytes(0));
  parts.push([0x00]);

  for (let fi=0; fi<frames.length; fi++) {
    const fd = frames[fi];
    // Graphic Control Extension
    parts.push([0x21,0xF9,0x04]);
    parts.push([0x04]); // restore to bg
    parts.push(shortToBytes(delay));
    parts.push([0x00, 0x00]);

    // Image Descriptor
    parts.push([0x2C]);
    parts.push(shortToBytes(0)); parts.push(shortToBytes(0));
    parts.push(shortToBytes(w)); parts.push(shortToBytes(h));
    parts.push([0x00]);

    // Map pixels to palette indices
    const indices = new Uint8Array(w*h);
    for (let y=0; y<h; y++)
      for (let x=0; x<w; x++) {
        const i=(y*w+x)*4, r=fd.data[i], g=fd.data[i+1], b=fd.data[i+2];
        let bi=0, bd=1e9;
        for (let p=0; p<256; p++) {
          const dr=r-palette[p*3], dg=g-palette[p*3+1], db=b-palette[p*3+2];
          const d=dr*dr+dg*dg+db*db;
          if(d<bd){bd=d;bi=p;}
        }
        indices[y*w+x]=bi;
      }

    const lzw = lzwEncode(indices, 8);
    parts.push([8]);
    const subBlocks = [];
    for (let j=0; j<lzw.length; j+=255) {
      const block = lzw.slice(j, Math.min(j+255, lzw.length));
      subBlocks.push(block.length);
      for (let k=0; k<block.length; k++) subBlocks.push(block[k]);
    }
    subBlocks.push(0);
    parts.push(subBlocks);
  }
  parts.push([0x3B]); // Trailer

  const total = parts.reduce((s,p)=>s+p.length,0);
  const res = new Uint8Array(total);
  let off=0;
  for(const p of parts){res.set(p,off); off+=p.length;}
  return res;
}

function buildPalette(frames) {
  const pal = new Uint8Array(768);
  let cnt=0;
  const seen=new Set();
  const keys=[[0,0,0],[255,255,255],[255,0,0],[0,255,0],[0,0,255],[255,255,0],[255,0,255],[0,255,255],[128,0,0],[0,128,0],[0,0,128],[128,128,0],[128,0,128],[0,128,128],[128,128,128],[192,192,192],[255,128,0],[255,0,128],[128,255,0],[0,255,128],[128,0,255],[0,128,255],[64,64,64],[96,96,96],[160,160,160],[224,224,224]];
  for(const [r,g,b] of keys){
    const k=(r<<16)|(g<<8)|b;
    if(!seen.has(k)&&cnt<256){pal[cnt*3]=r;pal[cnt*3+1]=g;pal[cnt*3+2]=b;seen.add(k);cnt++;}
  }
  for(const fd of frames){
    if(cnt>=256)break;
    for(let i=0;i<fd.data.length;i+=4){
      if(cnt>=256)break;
      const r=fd.data[i],g=fd.data[i+1],b=fd.data[i+2],k=(r<<16)|(g<<8)|b;
      if(!seen.has(k)){pal[cnt*3]=r;pal[cnt*3+1]=g;pal[cnt*3+2]=b;seen.add(k);cnt++;}
    }
  }
  for(let i=cnt;i<256;i++){const v=Math.round(i*255/256);pal[i*3]=v;pal[i*3+1]=v;pal[i*3+2]=v;}
  return pal;
}

function lzwEncode(data, minCodeSize) {
  const clearCode=1<<minCodeSize, eoiCode=clearCode+1;
  let codeSize=minCodeSize+1, nextCode=eoiCode+1;
  const dict=new Map();
  const out=[];
  let buf=0, bc=0;

  function wb(code,sz){buf|=code<<bc;bc+=sz;while(bc>=8){out.push(buf&0xFF);buf>>=8;bc-=8;}}
  wb(clearCode,codeSize);
  let w='';
  for(let i=0;i<data.length;i++){
    const k=String.fromCharCode(data[i]), wk=w+k;
    if(dict.has(wk)){w=wk;}
    else{
      wb(w.length===1?w.charCodeAt(0):dict.get(w),codeSize);
      if(nextCode<4096){dict.set(wk,nextCode++);if(nextCode>(1<<codeSize)&&codeSize<12)codeSize++;}
      else{wb(clearCode,codeSize);dict.clear();codeSize=minCodeSize+1;nextCode=eoiCode+1;}
      w=k;
    }
  }
  if(w.length){wb(w.length===1?w.charCodeAt(0):dict.has(w)?dict.get(w):0,codeSize);}
  wb(eoiCode,codeSize);
  if(bc>0)out.push(buf&0xFF);
  return new Uint8Array(out);
}

function exportPNGSequence() {
  stopPlay();
  showToast('Packaging frames...');
  const zip = new JSZip();
  const promises = [];
  for (let i=0; i<state.frames.length; i++) {
    ((idx) => {
      const offc = document.createElement('canvas');
      offc.width=state.canvasW; offc.height=state.canvasH;
      offc.getContext('2d').putImageData(state.frames[idx], 0, 0);
      const p = new Promise(resolve => {
        offc.toBlob(blob => {
          zip.file('frame_'+String(idx+1).padStart(4,'0')+'.png', blob);
          resolve();
        }, 'image/png');
      });
      promises.push(p);
    })(i);
  }
  Promise.all(promises).then(async () => {
    const zipBlob = await zip.generateAsync();
    downloadBlob(zipBlob, 'frames.zip');
    showToast('PNG sequence exported!');
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

// ========== HELPERS ==========
function hexToRgba(hex){return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16),a:1};}
function stringToBytes(s){const a=[];for(let i=0;i<s.length;i++)a.push(s.charCodeAt(i));return a;}
function shortToBytes(n){return[n&0xFF,(n>>8)&0xFF];}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2000);}

// ========== INLINE JSZip ==========
const JSZip = {_files:{},
  file(name,data){this._files[name]=data;},
  async generateAsync(){
    const enc=new TextEncoder(),parts=[],cdir=[];
    let offset=0;
    for(const [name,blob] of Object.entries(this._files)){
      const data=new Uint8Array(await blob.arrayBuffer());
      const nb=enc.encode(name),crc=crc32(data);
      const lh=new Uint8Array(30+nb.length);
      lh.set([0x50,0x4B,0x03,0x04],0);lh.set([0x0A,0x00],4);lh.set([0x00,0x00],6);lh.set([0x00,0x00],8);
      lh.set(new Uint8Array(new Uint32Array([crc]).buffer),14);
      lh.set(new Uint8Array(new Uint32Array([data.length]).buffer),18);
      lh.set(new Uint8Array(new Uint32Array([data.length]).buffer),22);
      lh.set(new Uint8Array(new Uint16Array([nb.length]).buffer),26);
      lh.set([0x00,0x00],28);lh.set(nb,30);
      parts.push(lh);parts.push(data);
      const cd=new Uint8Array(46+nb.length);
      cd.set([0x50,0x4B,0x01,0x02],0);cd.set([0x0A,0x00],4);cd.set([0x0A,0x00],6);cd.set([0x00,0x00],8);cd.set([0x00,0x00],10);
      cd.set(new Uint8Array(new Uint32Array([crc]).buffer),16);
      cd.set(new Uint8Array(new Uint32Array([data.length]).buffer),20);
      cd.set(new Uint8Array(new Uint32Array([data.length]).buffer),24);
      cd.set(new Uint8Array(new Uint16Array([nb.length]).buffer),28);
      cd.set([0x00,0x00],30);cd.set([0x00,0x00],32);cd.set([0x00,0x00],34);cd.set([0x00,0x00],36);cd.set([0x00,0x00,0x00,0x00],38);
      cd.set(new Uint8Array(new Uint32Array([offset]).buffer),42);
      cd.set(nb,46);cdir.push(cd);
      offset+=lh.length+data.length;
    }
    const cdsz=cdir.reduce((s,e)=>s+e.length,0),eocd=new Uint8Array(22);
    eocd.set([0x50,0x4B,0x05,0x06],0);eocd.set([0x00,0x00],4);eocd.set([0x00,0x00],6);
    eocd.set(new Uint8Array(new Uint16Array([cdir.length]).buffer),8);
    eocd.set(new Uint8Array(new Uint16Array([cdir.length]).buffer),10);
    eocd.set(new Uint8Array(new Uint32Array([cdsz]).buffer),12);
    eocd.set(new Uint8Array(new Uint32Array([offset]).buffer),16);
    eocd.set([0x00,0x00],20);
    const total=offset+cdsz+22,res=new Uint8Array(total);let pos=0;
    for(const p of parts){res.set(p,pos);pos+=p.length;}
    for(const cd of cdir){res.set(cd,pos);pos+=cd.length;}
    res.set(eocd,pos);
    return new Blob([res],{type:'application/zip'});
  }
};

function crc32(data){let c=0xFFFFFFFF;for(let i=0;i<data.length;i++){c^=data[i];for(let j=0;j<8;j++)c=(c>>>1)^(c&1?0xEDB88320:0);}return(c^0xFFFFFFFF)>>>0;}

// ========== EVENTS ==========
function bindEvents() {
  $$('.tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.tool = btn.dataset.tool;
    });
  });

  const presetColors = [
    '#ffffff','#000000','#e74c3c','#e67e22','#f1c40f','#2ecc71',
    '#1abc9c','#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a',
    '#ff5722','#795548','#607d8b','#ff9800','#4caf50','#2196f3',
    '#6c5ce7','#a29bfe','#fd79a8','#00cec9','#fab1a0','#81ecec',
  ];
  const pc = $('#colorPresets');
  presetColors.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (c===state.color?' active':'');
    dot.style.background = c;
    if (c==='#ffffff') dot.style.border='2px solid #555';
    dot.addEventListener('click', ()=>{state.color=c;updateColorUI();});
    pc.appendChild(dot);
  });

  const pp=$('#colorPickerPopup'), pi=$('#colorPickerInput');
  $('#btnMoreColors').addEventListener('click', (e)=>{
    const r=e.target.getBoundingClientRect();
    pp.style.left=(r.right+8)+'px'; pp.style.top=r.top+'px';
    pp.classList.toggle('show'); pi.value=state.color;
  });
  pi.addEventListener('input',()=>{state.color=pi.value;updateColorUI();});
  document.addEventListener('click',(e)=>{
    if(!pp.contains(e.target)&&e.target!==$('#btnMoreColors'))pp.classList.remove('show');
  });

  $('#brushSize').addEventListener('input',(e)=>{
    state.brushSize=parseInt(e.target.value);
    $('#sizeVal').textContent=state.brushSize+'px';
  });
  $('#onionSkin').addEventListener('change',(e)=>{state.onionSkin=e.target.checked;renderFrame(state.currentFrame);});
  $('#showGrid').addEventListener('change',(e)=>{state.showGrid=e.target.checked;renderFrame(state.currentFrame);});
  $('#mirrorH').addEventListener('change',(e)=>{state.mirrorH=e.target.checked;});
  $('#mirrorV').addEventListener('change',(e)=>{state.mirrorV=e.target.checked;});
  $('#fpsInput').addEventListener('change',(e)=>{
    state.fps=Math.max(1,Math.min(60,parseInt(e.target.value)||12));
  });

  $('#btnPlay').addEventListener('click',togglePlay);
  $('#btnFirst').addEventListener('click',()=>{stopPlay();renderFrame(0);});
  $('#btnPrev').addEventListener('click',()=>{stopPlay();if(state.currentFrame>0)renderFrame(state.currentFrame-1);});
  $('#btnNext').addEventListener('click',()=>{stopPlay();if(state.currentFrame<state.frames.length-1)renderFrame(state.currentFrame+1);});
  $('#btnLast').addEventListener('click',()=>{stopPlay();renderFrame(state.frames.length-1);});

  $('#btnAddFrame').addEventListener('click',()=>{saveCurrentFrame();addFrame();});
  $('#btnDupFrame').addEventListener('click',()=>{saveCurrentFrame();duplicateFrame();});
  $('#btnMoveLeft').addEventListener('click',()=>{saveCurrentFrame();moveFrame(-1);});
  $('#btnMoveRight').addEventListener('click',()=>{saveCurrentFrame();moveFrame(1);});

  $('#btnExportWebM').addEventListener('click',exportWebM);
  $('#btnExportGIF').addEventListener('click',exportGIF);
  $('#btnExportPNG').addEventListener('click',exportPNGSequence);

  $('#btnClear').addEventListener('click',()=>{
    state.frames[state.currentFrame]=ctx.createImageData(state.canvasW,state.canvasH);
    renderFrame(state.currentFrame);renderTimeline();
    showToast('Frame cleared');
  });

  document.addEventListener('keydown',(e)=>{
    if(e.target.tagName==='INPUT')return;
    switch(e.key){
      case ' ':e.preventDefault();togglePlay();break;
      case 'ArrowLeft':e.preventDefault();stopPlay();if(state.currentFrame>0)renderFrame(state.currentFrame-1);break;
      case 'ArrowRight':e.preventDefault();stopPlay();if(state.currentFrame<state.frames.length-1)renderFrame(state.currentFrame+1);break;
      case 'Home':e.preventDefault();stopPlay();renderFrame(0);break;
      case 'End':e.preventDefault();stopPlay();renderFrame(state.frames.length-1);break;
      case 'b':state.tool='pen';updateToolUI();break;
      case 'p':state.tool='pencil';updateToolUI();break;
      case 'e':state.tool='eraser';updateToolUI();break;
      case 'g':state.tool='fill';updateToolUI();break;
      case 'i':state.tool='picker';updateToolUI();break;
      case 'n':saveCurrentFrame();addFrame();break;
      case 'd':if(e.ctrlKey||e.metaKey){e.preventDefault();saveCurrentFrame();duplicateFrame();}break;
    }
  });
}

function updateColorUI(){
  $$('.color-dot').forEach(d=>{
    d.classList.toggle('active',d.style.background===state.color||d.style.background.replace(/\s/g,'')===state.color);
  });
  $('#colorPickerInput').value=state.color;
}

function updateToolUI(){
  $$('.tool-btn[data-tool]').forEach(b=>{b.classList.toggle('active',b.dataset.tool===state.tool);});
}

// ========== START ==========
init();
showToast('Animation Studio ready - Space to play, arrows to navigate');
</script>
