<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snap Shatter</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
#mainCanvas { display:block; position:absolute; top:0; left:0; }
#video { display:none; }
#loading {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:10; background:#000; color:#00f0ff; font-size:18px;
  transition:opacity .5s;
}
#loading .spinner {
  width:40px; height:40px; border:3px solid rgba(0,240,255,.2);
  border-top-color:#00f0ff; border-radius:50%; animation:spin 1s linear infinite;
  margin-bottom:16px;
}
@keyframes spin { to { transform:rotate(360deg); } }
#permission-hint {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  color:rgba(255,255,255,.7); font-size:15px; text-align:center;
  pointer-events:none; z-index:5; transition:opacity .3s;
  text-shadow:0 0 10px rgba(0,240,255,.3);
}
#snap-indicator {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  color:#a855f7; font-size:13px; opacity:0; transition:all .3s;
  text-shadow:0 0 12px rgba(168,85,247,.6); z-index:5;
}
</style>
</head>
<body>
<video id="video" playsinline></video>
<canvas id="mainCanvas"></canvas>
<div id="loading">
  <div class="spinner"></div>
  <div id="loadingText">Loading hand tracking model...</div>
</div>
<div id="permission-hint">Make a snapping gesture to shatter the screen</div>
<div id="snap-indicator">&#x2728; Snap!</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>

<script>
// ===== DOM =====
const video = document.getElementById('video');
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const permissionHint = document.getElementById('permission-hint');
const snapIndicator = document.getElementById('snap-indicator');

// ===== CANVAS SIZING =====
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ===== HAND CONNECTIONS =====
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
];

// ===== SNAP DETECTOR =====
const SnapDetector = {
  state: 'IDLE',
  lastDist: 1,
  pressedFrames: 0,
  cooldown: 0,
  snapX: 0.5,
  snapY: 0.5,
  callback: null,

  update(landmarks) {
    if (this.cooldown > 0) { this.cooldown--; return; }

    const thumb  = landmarks[4];
    const middle = landmarks[12];
    const dx = thumb.x - middle.x;
    const dy = thumb.y - middle.y;
    const dz = (thumb.z || 0) - (middle.z || 0);
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

    switch (this.state) {
      case 'IDLE':
        if (dist < 0.045) {
          this.state = 'PRESSED';
          this.pressedFrames = 0;
        }
        break;
      case 'PRESSED':
        this.pressedFrames++;
        if (dist > 0.08 && this.pressedFrames >= 2) {
          this.state = 'SNAPPED';
          this.snapX = (thumb.x + middle.x) / 2;
          this.snapY = (thumb.y + middle.y) / 2;
          if (this.callback) this.callback(this.snapX, this.snapY);
          this.cooldown = 30;
          this.state = 'IDLE';
        } else if (dist > 0.1) {
          this.state = 'IDLE';
        }
        break;
    }
    this.lastDist = dist;
  }
};

// ===== PARTICLES =====
let ambientParticles = [];
let burstParticles = [];

function spawnAmbientParticle(x, y) {
  ambientParticles.push({
    x, y,
    vx: (Math.random()-0.5)*0.4,
    vy: (Math.random()-0.5)*0.4 - 0.3,
    life: 1, decay: 0.005 + Math.random()*0.015,
    size: 1 + Math.random()*2,
    color: Math.random()<0.5 ? '#00f0ff' : '#a855f7',
  });
}

function spawnBurst(x, y, count) {
  for (let i=0; i<count; i++) {
    const angle = Math.random()*Math.PI*2;
    const speed = 2 + Math.random()*10;
    burstParticles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1, decay: 0.01 + Math.random()*0.03,
      size: 1 + Math.random()*3,
      color: Math.random()<0.4 ? '#00f0ff' : Math.random()<0.5 ? '#a855f7' : '#fff',
    });
  }
}

function updateAmbientParticles(handX, handY) {
  if (handX !== null) {
    const tx = handX * canvas.width;
    const ty = handY * canvas.height;
    spawnAmbientParticle(tx, ty);
    if (Math.random()<0.4) spawnAmbientParticle(tx, ty);
  }
  for (let i=ambientParticles.length-1; i>=0; i--) {
    const p = ambientParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life<=0) ambientParticles.splice(i,1);
  }
  if (ambientParticles.length>60) ambientParticles.splice(0, ambientParticles.length-60);
}

function updateBurstParticles() {
  for (let i=burstParticles.length-1; i>=0; i--) {
    const p = burstParticles[i];
    p.x += p.vx; p.vy += 0.15;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life<=0) burstParticles.splice(i,1);
  }
}

function drawParticles(particles) {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ===== SHATTER ENGINE =====
let fragments = [];
let shattering = false;
let shatterStart = 0;
const SHATTER_DURATION = 1500;
let glassTexture = null;
let glassRecovery = 0; // 0=normal, >0 fading back

function createGlassTexture() {
  const gc = document.createElement('canvas');
  gc.width = 256; gc.height = 256;
  const gctx = gc.getContext('2d');
  const id = gctx.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) {
    const n = Math.random() * 40;
    id.data[i] = 255;
    id.data[i+1] = 255;
    id.data[i+2] = 255;
    id.data[i+3] = 25 + n;
  }
  gctx.putImageData(id, 0, 0);
  return gc;
}

function drawGlassOverlay(alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  // White frosted base
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Noise texture
  if (glassTexture) {
    ctx.globalAlpha = alpha * 0.25;
    for (let y = 0; y < canvas.height; y += glassTexture.height) {
      for (let x = 0; x < canvas.width; x += glassTexture.width) {
        ctx.drawImage(glassTexture, x, y);
      }
    }
  }
  ctx.restore();
}

function triggerShatter(sx, sy) {
  shattering = true;
  glassRecovery = 0;
  shatterStart = performance.now();
  generateFragments(sx, sy);

  // Burst particles from snap position
  const cx = (1 - sx) * canvas.width;
  const cy2 = sy * canvas.height;
  for (let j=0; j<5; j++) {
    setTimeout(() => spawnBurst(cx+Math.random()*80-40, cy2+Math.random()*80-40, 30), j*60);
  }

  // Flash indicator
  snapIndicator.style.opacity = '1';
  setTimeout(() => snapIndicator.style.opacity = '0', 800);
}

function generateFragments(sx, sy) {
  fragments = [];
  const w = canvas.width, h = canvas.height;
  const ox = (1 - sx) * w; // snap origin in canvas space (mirrored)
  const oy = sy * h;

  // Radial irregular fragmentation
  const rings = [
    { r: 0.04, sectors: 8,  jitter: 0.6 },
    { r: 0.12, sectors: 12, jitter: 0.5 },
    { r: 0.25, sectors: 18, jitter: 0.45 },
    { r: 0.45, sectors: 24, jitter: 0.4 },
    { r: 0.75, sectors: 30, jitter: 0.35 },
    { r: 1.2,  sectors: 36, jitter: 0.3 },
  ];

  const maxDim = Math.max(w, h) * 1.5;
  let prevOuter = [];

  for (let ri = 0; ri < rings.length; ri++) {
    const ring = rings[ri];
    const rInner = ri === 0 ? 0 : rings[ri-1].r * maxDim * 0.9;
    const rOuter = ring.r * maxDim;
    const n = ring.sectors;
    const jit = ring.jitter;
    const currentOuter = [];

    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2;
      const a1 = ((i + 1) / n) * Math.PI * 2;

      // Jittered angles
      const ja0 = a0 + (Math.random() - 0.5) * (Math.PI * 2 / n) * jit;
      const ja1 = a1 + (Math.random() - 0.5) * (Math.PI * 2 / n) * jit;

      // Jittered radii
      const jrInner = rInner + (Math.random() - 0.5) * rInner * jit * 0.8;
      const jrOuter = rOuter + (Math.random() - 0.5) * rOuter * jit * 0.6;

      // Four corners of the fragment
      let p0, p1, p2, p3;

      if (ri === 0) {
        // Inner ring: triangles from origin
        p0 = { x: ox, y: oy };
        p1 = { x: ox + Math.cos(ja0) * jrOuter, y: oy + Math.sin(ja0) * jrOuter };
        p2 = { x: ox + Math.cos(ja1) * jrOuter, y: oy + Math.sin(ja1) * jrOuter };
        p3 = null; // triangle
      } else {
        p0 = { x: ox + Math.cos(ja0) * jrInner, y: oy + Math.sin(ja0) * jrInner };
        p1 = { x: ox + Math.cos(ja0) * jrOuter, y: oy + Math.sin(ja0) * jrOuter };
        p2 = { x: ox + Math.cos(ja1) * jrOuter, y: oy + Math.sin(ja1) * jrOuter };
        p3 = { x: ox + Math.cos(ja1) * jrInner, y: oy + Math.sin(ja1) * jrInner };
      }

      const pts = p3 ? [p0, p1, p2, p3] : [p0, p1, p2];
      const centerX = pts.reduce((s, p) => s + p.x, 0) / pts.length;
      const centerY = pts.reduce((s, p) => s + p.y, 0) / pts.length;

      // Velocity: radial from snap origin
      const dx = centerX - ox, dy = centerY - oy;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const angle = Math.atan2(dy, dx);
      const baseSpeed = 2 + (dist / maxDim) * 10;
      const speed = baseSpeed + Math.random() * 4;

      fragments.push({
        poly: pts,
        cx: centerX, cy: centerY,
        ox: 0, oy: 0,
        vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 2,
        vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 2,
        rotation: 0,
        angVel: (Math.random() - 0.5) * 0.3,
        glassAlpha: 0.04 + Math.random() * 0.18,
      });
    }
  }
}

function updateFragments() {
  const elapsed = performance.now() - shatterStart;
  const progress = Math.min(elapsed / SHATTER_DURATION, 1);
  const eased = 1 - Math.pow(1-progress, 3);

  for (const f of fragments) {
    f.ox = f.vx * eased * 120;
    f.oy = (f.vy * eased * 120) + (eased*eased*300);
    f.rotation = f.angVel * eased * 15;
  }

  if (progress >= 1) {
    shattering = false;
    fragments = [];
    glassRecovery = 0; // Start fade-in of new glass
  }
}

function drawFragments() {
  for (const f of fragments) {
    ctx.save();
    ctx.translate(f.cx + f.ox, f.cy + f.oy);
    ctx.rotate(f.rotation);

    // Clip to polygon
    ctx.beginPath();
    ctx.moveTo(f.poly[0].x-f.cx, f.poly[0].y-f.cy);
    for (let i=1; i<f.poly.length; i++) {
      ctx.lineTo(f.poly[i].x-f.cx, f.poly[i].y-f.cy);
    }
    ctx.closePath();
    ctx.clip();

    // Frosted glass base
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-canvas.width, -canvas.height, canvas.width*2, canvas.height*2);

    // Noise texture
    if (glassTexture) {
      ctx.globalAlpha = 0.3;
      for (let y=-canvas.height; y<canvas.height; y+=glassTexture.height) {
        for (let x=-canvas.width; x<canvas.width; x+=glassTexture.width) {
          ctx.drawImage(glassTexture, x, y);
        }
      }
      ctx.globalAlpha = 1;
    }

    // Glass reflection gradient
    const grad = ctx.createLinearGradient(-15, -15, 15, 15);
    grad.addColorStop(0, `rgba(255,255,255,${f.glassAlpha*2})`);
    grad.addColorStop(0.4, `rgba(255,255,255,${f.glassAlpha})`);
    grad.addColorStop(0.6, 'rgba(255,255,255,0)');
    grad.addColorStop(1, `rgba(255,255,255,${f.glassAlpha*0.3})`);
    ctx.fillStyle = grad;
    ctx.fillRect(-canvas.width, -canvas.height, canvas.width*2, canvas.height*2);

    // Bright edge highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.restore();
  }
}

// ===== HAND RENDERING =====
let latestLandmarks = null;

function drawHandSkeleton(landmarks) {
  if (!landmarks || landmarks.length===0) return;

  const w=canvas.width, h=canvas.height;

  // Draw connections with neon glow
  ctx.save();
  for (const [i,j] of HAND_CONNECTIONS) {
    const a=landmarks[i], b=landmarks[j];
    if (!a || !b) continue;
    const ax=(1-a.x)*w, ay=a.y*h;
    const bx=(1-b.x)*w, by=b.y*h;

    // Glow layer
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.strokeStyle='rgba(0,240,255,0.2)';
    ctx.lineWidth=6;
    ctx.shadowColor='#00f0ff';
    ctx.shadowBlur=12;
    ctx.stroke();

    // Core line
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.strokeStyle='rgba(0,240,255,0.8)';
    ctx.lineWidth=2;
    ctx.shadowBlur=0;
    ctx.stroke();

    // Purple accent on palm connections
    if ((i===0&&j===5)||(i===0&&j===9)||(i===0&&j===13)||(i===0&&j===17)||(i===5&&j===9)||(i===9&&j===13)||(i===13&&j===17)) {
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.strokeStyle='rgba(168,85,247,0.4)';
      ctx.lineWidth=1.5;
      ctx.stroke();
    }
  }

  // Draw landmarks
  for (let i=0; i<landmarks.length; i++) {
    const l=landmarks[i];
    if (!l) continue;
    const x=(1-l.x)*w, y=l.y*h;
    const isTip=[4,8,12,16,20].includes(i);

    // Glow
    ctx.beginPath();
    ctx.arc(x, y, isTip ? 6 : 3, 0, Math.PI*2);
    ctx.fillStyle=isTip ? 'rgba(168,85,247,0.6)' : 'rgba(0,240,255,0.4)';
    ctx.shadowColor=isTip ? '#a855f7' : '#00f0ff';
    ctx.shadowBlur=isTip ? 14 : 8;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(x, y, isTip ? 3 : 1.5, 0, Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.shadowBlur=0;
    ctx.fill();
  }
  ctx.restore();
}

// ===== MEDIAPIPE SETUP =====
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.4,
});

hands.onResults((results) => {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    latestLandmarks = results.multiHandLandmarks[0];
    SnapDetector.update(latestLandmarks);
  } else {
    latestLandmarks = null;
  }
});

// ===== CAMERA SETUP =====
async function setupCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (e) {
    loadingText.textContent = 'Camera access needed. Please allow camera permissions and reload.';
    loadingText.style.color = '#e74c3c';
    document.querySelector('.spinner').style.display = 'none';
    return false;
  }
}

// ===== SNAP CALLBACK =====
SnapDetector.callback = (sx, sy) => {
  if (!shattering) triggerShatter(sx, sy);
};

// ===== RENDER LOOP =====
let webcamReady = false;
let frameSending = false;

async function sendFrame() {
  if (!frameSending && webcamReady && video.readyState >= 2) {
    frameSending = true;
    try { await hands.send({image: video}); } catch(e) {}
    frameSending = false;
  }
}

function renderLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Layer 1: Always draw webcam (mirrored) — never affected by shatter
  if (webcamReady) {
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // Layer 2: Hand skeleton (visible through glass)
  if (latestLandmarks) {
    drawHandSkeleton(latestLandmarks);
  }

  // Layer 3: Glass overlay. Either normal frosted glass or flying shards.
  if (shattering) {
    drawFragments();
  } else {
    // Recovery fade-in after shatter ends
    if (glassRecovery > 0) {
      glassRecovery = Math.max(0, glassRecovery - 0.012);
    }
    drawGlassOverlay(Math.max(glassRecovery, 1));
  }

  // Layer 4: Particles on top of everything
  const handX = latestLandmarks ? (1 - latestLandmarks[8].x) : null;
  const handY = latestLandmarks ? latestLandmarks[8].y : null;
  updateAmbientParticles(handX, handY);
  updateBurstParticles();
  drawParticles(ambientParticles);
  drawParticles(burstParticles);

  // Send frame to MediaPipe
  sendFrame();

  // Update fragments if shattering
  if (shattering) updateFragments();

  requestAnimationFrame(renderLoop);
}

// ===== INIT =====
async function init() {
  const camOk = await setupCamera();
  if (!camOk) return;

  webcamReady = true;

  // Hide loading
  loading.style.opacity = '0';
  setTimeout(() => { loading.style.display = 'none'; }, 500);

  // Hide hint after a while
  setTimeout(() => {
    permissionHint.style.opacity = '0';
  }, 6000);

  // Initialize glass texture
  glassTexture = createGlassTexture();

  // Start render loop
  requestAnimationFrame(renderLoop);
}

// Handle MediaPipe model loading
const modelLoadTimeout = setTimeout(() => {
  if (loading.style.display !== 'none') {
    loadingText.textContent = 'Model loading is slow. Check your network and reload.';
    loadingText.style.color = '#f39c12';
  }
}, 15000);

hands.initialize().then(() => {
  clearTimeout(modelLoadTimeout);
  init();
}).catch((e) => {
  clearTimeout(modelLoadTimeout);
  loadingText.textContent = 'Failed to load hand tracking. Please reload the page.';
  loadingText.style.color = '#e74c3c';
  document.querySelector('.spinner').style.display = 'none';
  console.error('MediaPipe init error:', e);
});
</script>
</body>
</html>
